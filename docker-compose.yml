version: '3.8'
services:
  backend:
    build:
      context: ./backend  
      dockerfile: Dockerfile  
    ports:
      - "3008:3008"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://root:rootpassword@mongo:27017/teste_hub_xp?authSource=admin
    volumes:
      - ./backend:/app
    depends_on:
      - mongo
    networks:
      - my_network  

  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - ./data/db:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=rootpassword
    networks:
      - my_network 

  lambda-sales-report:
    build:
      context: ./backend/lambdas
      dockerfile: Dockerfile
    environment:
      - MONGO_URI=mongodb://root:rootpassword@mongo:27017/teste_hub_xp?authSource=admin
    ports:
      - "3000:3000"  # porta para acessar a API Lambda localmente
    depends_on:
      - mongo
    networks:
      - my_network

networks:
  my_network:
    driver: bridge
